# Termux Configuration for termux-agent-station
# Optimized for remote AI coding agents (Herdr, OMP, Claude Code, Codex)

### Extra Keys Row Matrix
# Row 1: ESC, TAB, CTRL, ALT, UP (popup: PGUP), DOWN (popup: PGDN), ENTER
# Row 2: / (popup: |), - (popup: _), ~ (popup: $), ' (popup: `), LEFT (popup: HOME), RIGHT (popup: END), DRAWER
extra-keys = [ \
  [ \
    {"key": "ESC", "popup": "FN"}, \
    {"key": "TAB", "popup": "\\"}, \
    {"key": "CTRL", "popup": "INSERT"}, \
    {"key": "ALT", "popup": "DELETE"}, \
    {"key": "UP", "popup": "PGUP"}, \
    {"key": "DOWN", "popup": "PGDN"}, \
    {"key": "ENTER", "popup": "KEYBOARD"} \
  ], \
  [ \
    {"key": "/", "popup": "|"}, \
    {"key": "-", "popup": "_"}, \
    {"key": "~", "popup": "$"}, \
    {"key": "QUOTE", "popup": "BACKQUOTE"}, \
    {"key": "LEFT", "popup": "HOME"}, \
    {"key": "RIGHT", "popup": "END"}, \
    {"key": "DRAWER", "popup": "KEYBOARD"} \
  ] \
]

### Cursor & UI Behavior
terminal-cursor-style = bar
terminal-cursor-blink-rate = 500
bell-character = ignore
back-key = back
use-fullscreen = false
extra-keys-style = default
fullscreen = false
enforce-char-based-input = true
