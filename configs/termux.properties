# Termux Extra Keys Configuration
# Optimized for Herdr / Tmux / OMP / AI Agent Workstations
# Row 1: ⌨ ◀ ▶ PG▲ PG▼ ⌫
# Row 2: ESC TAB CTRL ALT ← ↓ ↑ → ↵
#
# VERIFIED on vivo iQOO (Android 16 / OriginOS), Termux 0.119:
#   ◀ = F7 (herdr previous_tab)   ▶ = F8 (herdr next_tab)
#   PG▲ / PG▼ = single-token macros (the ONLY form that scrolls; plain
#               "PGUP"/"PGDN" strings and {"key":"PGUP"} do NOT work)
#   ⌨ = KEYBOARD toggle (soft keyboard show/hide)
#
# CRITICAL Termux macro syntax rules (learned the hard way):
#   * Macros are SPACE-separated: "CTRL ALT z".  "+"-joined ("ctrl+alt+z")
#     is invalid and is sent as LITERAL TEXT.
#   * "[" and "]" are NOT named keys — they cannot carry the ALT modifier,
#     so herdr "ctrl+alt+[ / ctrl+alt+]" bindings are UNREACHABLE via macros.
#   * Therefore agent actions use plain F-keys (F5/F6/F7/F8), which herdr
#     already binds. No modifier macros needed.
#   * Unrecognized tokens are sent as literal code-point strings
#     (ExtraKeysInfo.java) — that is why bad macros type themselves out.

extra-keys-style = default
extra-keys-text-all-caps = false

extra-keys = [[ \
  {"key": "KEYBOARD", "display": "⌨", "popup": "DRAWER"}, \
  {"key": "F7", "display": "◀", "popup": {"key": "F5", "display": "GOTO"}}, \
  {"key": "F8", "display": "▶", "popup": {"key": "F6", "display": "📜"}}, \
  {"macro": "PGUP", "display": "PG▲"}, \
  {"macro": "PGDN", "display": "PG▼"}, \
  {"key": "BKSP", "display": "⌫", "popup": {"macro": "CTRL u", "display": "Clear"}} \
], [ \
  {"key": "ESC", "popup": {"macro": "CTRL c", "display": "^C"}}, \
  {"key": "TAB", "popup": "BACKSLASH"}, \
  {"key": "CTRL", "popup": "~"}, \
  {"key": "ALT", "popup": "$"}, \
  {"key": "LEFT", "display": "←", "popup": "HOME"}, \
  {"key": "DOWN", "display": "↓", "popup": {"macro": "PGDN", "display": "PG▼"}}, \
  {"key": "UP", "display": "↑", "popup": {"macro": "PGUP", "display": "PG▲"}}, \
  {"key": "RIGHT", "display": "→", "popup": "END"}, \
  {"key": "ENTER", "display": "↵", "popup": {"key": "/", "display": "/"}} \
]]

### CJK / IME Composition Behavior
### MUST be false: Android IME (pinyin/shuangpin) needs the composition
### buffer (setComposingText). "true" forces per-char dispatch and breaks
### Chinese input.
enforce-char-based-input = false

### Cursor & UI Behavior
terminal-cursor-style = bar
terminal-cursor-blink-rate = 500
bell-character = ignore
back-key = back
use-fullscreen = false
fullscreen = false

### Keyboard / Scrollback
soft-keyboard-toggle-behaviour = show/hide
terminal-transcript-rows = 5000
terminal-toolbar-height = 1.3
